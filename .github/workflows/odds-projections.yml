# Publishes bookmaker-derived team projections (expected goals / clean sheet
# odds per fixture) to GitHub Pages for the FPL Difficulty app's
# Difficulty > Odds view. Setup in README.md.
name: Odds projections

on:
  schedule:
    # 3 runs/day x 2 markets x 1 region = ~180 of the free 500 monthly credits.
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build team-projections.json
        run: node scripts/build-projections.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/team-projections.json
          OUT_DIR: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
