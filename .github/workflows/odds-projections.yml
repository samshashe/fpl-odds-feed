# Publishes bookmaker-derived team projections (expected goals / clean sheet
# odds per fixture) to GitHub Pages for the FPL Difficulty app's
# Difficulty > Odds view. Setup in README.md.
name: Odds projections

on:
  schedule:
    # 3 runs/day x 2 markets x 1 region = ~180 of the free 500 monthly credits.
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build team-projections.json
        run: node scripts/build-projections.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/team-projections.json
          OUT_DIR: site
      # Same Pages site, so every deploy carries both files; rebuilt about once a day.
      - name: Build player-priors.json
        continue-on-error: true
        run: node scripts/build-priors.mjs
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/player-priors.json
          OUT_DIR: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Current (Node 24) Pages actions: the v3 upload / v4 deploy pair started
      # failing on 2026-11-23 ("No artifacts named github-pages", "Deployment
      # failed, try again later"). Pages deploys occasionally fail
      # transiently, so one retry after a short wait.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
